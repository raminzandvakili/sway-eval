[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "sway-eval"
version = "0.0.1"
description = "Audit how much the order of a record's sections decides an AI decision model's verdict"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ramin Zandvakili" }]
keywords = [
    "decision models",
    "System One models",
    "LLM evaluation",
    "calibration",
    "order sensitivity",
    "context attribution",
    "robustness",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
sway-eval = "sway_eval.cli:main"

[project.urls]
Homepage = "https://github.com/raminzandvakili/sway-eval"
Issues = "https://github.com/raminzandvakili/sway-eval/issues"

[project.optional-dependencies]
data = [
    "datasets>=5.1.0",
]
local = [
    "accelerate>=1.0",
    "huggingface-hub>=1.0",
    "pillow>=11",
    "torch==2.11.*",
    "torchvision==0.26.*",
    "transformers==5.10.2",
]

local-d2 = [
    "accelerate>=1.0",
    "huggingface-hub>=1.0",
    "peft>=0.17",
    "pillow>=11",
    "safetensors>=0.6",
    "torch==2.11.*",
    "torchvision==0.26.*",
    "transformers==5.17.*",
]

[tool.uv]
conflicts = [[{ extra = "local" }, { extra = "local-d2" }]]

[tool.hatch.build.targets.wheel]
packages = ["sway_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cu130", marker = "sys_platform == 'linux'" }
