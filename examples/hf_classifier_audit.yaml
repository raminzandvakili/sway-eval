# An audit of a generic Hugging Face sequence classifier (a small NLI model) used as a decision
# model: the instruction and the record go in as a text pair, and two of its labels stand for the
# two options. Runs on CPU; the first run downloads the model (about 70M parameters).
# Relative paths resolve against this file's folder.
name: hf_classifier_audit
question: "How often does the order of a record's sections decide a small NLI classifier's verdict?"
date: launch                 # stamped with the launch date (UTC)
seed: 0

model:
  provider: hf_classifier
  name: nli-deberta-v3-xsmall
  repo: cross-encoder/nli-deberta-v3-xsmall
  version: a150876415327c80daeff35ca6f68f5ed8cf5c24   # Hub commit, pinned
  labels: {ADVANCE: entailment, DO NOT ADVANCE: contradiction}   # option -> classifier label
  input_mode: pair           # (instruction, record) as a text pair
  device: cpu
  price_per_m_input_tokens: 0.0
  est_latency_s: 0.05
  concurrency: 1

dataset:
  kind: synthetic_rubric
  items: out/items.jsonl     # written by `sway-eval generate`
  threshold: 8
  levels: [-5, 4]
  per_level: 5

prompt:
  instruction: "Screen this candidate with the following rule. Score points as follows: 1 point per year of relevant experience (at most 8); degree: bachelor's 1, master's 2, doctorate 3, none 0; 1 point per required skill listed (required skills: Python, SQL, statistics, cloud deployment, data visualization); 1 point per certification. A candidate advances if their total is at least 8 points. Nothing else counts. Should this candidate advance?"
  options: [ADVANCE, DO NOT ADVANCE]
  target: ADVANCE
  format: {separator: "\n\n", heading_style: "{h}:", bullet: "- "}

layouts:
  kind: williams             # the balanced set: 10 orderings per record

content_free: true
option_rotations: true
format_variants:
  - {separator: "\n"}
  - {heading_style: "## {h}"}
  - {bullet: "* "}

analysis:
  tie_option: DO NOT ADVANCE
  axis: level
  zone_width: span
  pi: 0.10
  taus: [0.80, 0.90]
  level_step: 1
  threshold_level: 0
  slope_window: 2

output_root: out/results
cache: out/cache_hf.sqlite
